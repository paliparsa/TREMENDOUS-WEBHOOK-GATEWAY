name: Bootstrap and deploy Cloudflare Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tremendous-webhook-gateway-production
  cancel-in-progress: false

jobs:
  bootstrap-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test

      - name: Provision D1 and Queues (idempotent)
        id: provision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to GitHub Actions secrets}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions variable}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          d1="$(curl -fsS "${auth[@]}" "$api/d1/database?name=tremendous-webhook-gateway")"
          if [[ "$(jq -r '.success' <<<"$d1")" != "true" ]]; then
            echo "$d1" | jq -r '.errors'
            exit 1
          fi
          db_id="$(jq -r '.result[]? | select(.name=="tremendous-webhook-gateway") | .uuid' <<<"$d1" | head -n1)"
          if [[ -z "$db_id" ]]; then
            created="$(curl -fsS -X POST "${auth[@]}" "$api/d1/database" --data '{"name":"tremendous-webhook-gateway"}')"
            [[ "$(jq -r '.success' <<<"$created")" == "true" ]] || { echo "$created" | jq -r '.errors'; exit 1; }
            db_id="$(jq -r '.result.uuid' <<<"$created")"
          fi
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

          ensure_queue() {
            local queue_name="$1"
            local listed created
            listed="$(curl -fsS "${auth[@]}" "$api/queues")"
            [[ "$(jq -r '.success' <<<"$listed")" == "true" ]] || { echo "$listed" | jq -r '.errors'; exit 1; }
            if ! jq -e --arg name "$queue_name" '.result[]? | select(.queue_name==$name)' <<<"$listed" >/dev/null; then
              created="$(curl -fsS -X POST "${auth[@]}" "$api/queues" --data "$(jq -nc --arg name "$queue_name" '{queue_name:$name}')")"
              [[ "$(jq -r '.success' <<<"$created")" == "true" ]] || { echo "$created" | jq -r '.errors'; exit 1; }
            fi
          }
          ensure_queue "tremendous-webhook-events"
          ensure_queue "tremendous-webhook-events-dlq"

      - name: Prepare deployment config
        env:
          DB_ID: ${{ steps.provision.outputs.database_id }}
        run: |
          sed "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml > wrangler.ci.toml
          grep -q "$DB_ID" wrangler.ci.toml

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tremendous-webhook-gateway --remote --config wrangler.ci.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TREMENDOUS_WEBHOOK_SECRET: ${{ secrets.TREMENDOUS_WEBHOOK_SECRET }}
          GATEWAY_ADMIN_TOKEN: ${{ secrets.GATEWAY_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TREMENDOUS_WEBHOOK_SECRET:?Add TREMENDOUS_WEBHOOK_SECRET to GitHub Actions secrets}"
          : "${GATEWAY_ADMIN_TOKEN:?Add GATEWAY_ADMIN_TOKEN to GitHub Actions secrets}"
          printf '%s' "$TREMENDOUS_WEBHOOK_SECRET" | npx wrangler secret put TREMENDOUS_WEBHOOK_SECRET --config wrangler.ci.toml
          printf '%s' "$GATEWAY_ADMIN_TOKEN" | npx wrangler secret put GATEWAY_ADMIN_TOKEN --config wrangler.ci.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.ci.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
