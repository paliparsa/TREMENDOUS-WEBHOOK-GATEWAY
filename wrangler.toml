name = "tremendous-webhook-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-31"
workers_dev = true

[vars]
APP_ENV = "production"
MAX_BODY_BYTES = "262144"

[[d1_databases]]
binding = "DB"
database_name = "tremendous-webhook-gateway"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "tremendous-webhook-events"

[[queues.consumers]]
queue = "tremendous-webhook-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "tremendous-webhook-events-dlq"

# Bind notify.roshava.app to this Worker in Cloudflare after the DNS zone is ready.
# Do not add the custom domain until the Worker is deployed and secrets are configured.

[triggers]
crons = ["0 4 * * *"]
