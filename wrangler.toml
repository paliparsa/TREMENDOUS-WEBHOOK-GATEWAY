name = "tremendous-webhook-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-31"
workers_dev = true
keep_vars = true

[vars]
APP_ENV = "production"
MAX_BODY_BYTES = "262144"

[[durable_objects.bindings]]
name = "WEBHOOK_STORE"
class_name = "WebhookStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebhookStore"]

[[routes]]
pattern = "notify.roshava.app"
custom_domain = true

[triggers]
crons = ["0 4 * * *"]
